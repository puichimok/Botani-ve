<script>
$(document).ready(function () {
  var isTouchDevice = 'ontouchstart' in document.documentElement;

  if (!isTouchDevice) {
    $('.navbar .dropdown').hover(
      function () {
        $(this).addClass('show');
        $(this).find('.dropdown-menu').addClass('show');
      },
      function () {
        $(this).removeClass('show');
        $(this).find('.dropdown-menu').removeClass('show');
      }
    );
  }

  $('.navbar .dropdown > a').on('click', function (e) {
    var href = $(this).attr('href');

    if ($(window).width() >= 450) {
      e.preventDefault();
      window.location = href;
    } else {
      e.preventDefault();
      var $parent = $(this).parent();
      $parent.toggleClass('show');
      $parent.find('.dropdown-menu').toggleClass('show');
    }
  });
});
  $('#brandModal').on('show.bs.modal', function (e) {
    var btn = $(e.relatedTarget);

    var title = btn.data('title') || '';
    var img = btn.data('img') || '';
    var desc = btn.data('desc') || '';
    var body = btn.data('body') || '';
    var tags = btn.data('tags') || '';

    $('#modalBrandTitle').text(title);
    $('#modalBrandDesc').text(desc);

    if (img) {
      $('#modalBrandImg').attr('src', img).attr('alt', title);
      $('.brand-modal-logoWrap').show();
    } else {
      $('.brand-modal-logoWrap').hide();
    }

    function toParagraphs(text) {
      return String(text || '')
        .split('||')
        .map(function(t){ t = t.trim(); return t ? ('<p>' + t + '</p>') : ''; })
        .join('');
    }

    $('#modalBrandBody').html(toParagraphs(body));

    // tags chips
    var html = '';
    String(tags || '').split(',').forEach(function(t){
      t = t.trim();
      if (!t) return;
      html += '<span class="brand-tag">' + t + '</span>';
    });
    $('#modalBrandTags').html(html);
  });
</script>
